# Format, analyze, test, scan dependency licenses, and build the app.
# Flutter is pinned to the stable revision recorded in app/.metadata
# (3.50.0, ab2912035e160d9cad6306df307576da6128ebdb, Dart 3.14.0).
# Push runs only on main. Pull requests cover topic branches, so one commit
# is not built twice.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  check:
    name: format, analyze, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze app
        working-directory: app
        run: flutter analyze

      - name: Test app
        working-directory: app
        run: flutter test

      - name: Analyze lingo_core
        working-directory: packages/lingo_core
        run: dart analyze

      - name: Test lingo_core
        working-directory: packages/lingo_core
        run: dart test

      - name: Analyze lingo_protocol
        working-directory: packages/lingo_protocol
        run: dart analyze

      - name: Test lingo_protocol
        working-directory: packages/lingo_protocol
        run: dart test

  license-scan:
    name: license scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve workspace
        run: dart pub get

      - name: Test the scanner
        working-directory: tool/license_scan
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Scan workspace dependency licenses
        working-directory: tool/license_scan
        run: dart run bin/check_licenses.dart --repo-root ../.. --label workspace

      - name: Scan scanner dependency licenses
        working-directory: tool/license_scan
        run: >
          dart run bin/check_licenses.dart
          --repo-root ../..
          --package-config .dart_tool/package_config.json
          --lock pubspec.lock
          --label license_scan
          --allow-absent-exceptions

  build:
    name: build android and linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev g++ libstdc++-14-dev

      - name: Resolve dependencies
        run: dart pub get

      - name: Build Android debug APK
        working-directory: app
        run: |
          # The Flutter template asks Gradle for an 8G heap. Keep that file for
          # local machines, and give the hosted runner a smaller heap.
          sed -i \
            -e 's/-Xmx8G/-Xmx2G/' \
            -e 's/MaxMetaspaceSize=4G/MaxMetaspaceSize=512m/' \
            -e 's/ReservedCodeCacheSize=512m/ReservedCodeCacheSize=256m/' \
            android/gradle.properties
          flutter build apk --debug

      - name: Build Linux debug bundle
        working-directory: app
        run: flutter build linux --debug
