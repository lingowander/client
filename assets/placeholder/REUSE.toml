# assets/placeholder/REUSE.toml - DRAFT, 须律师/法务确认.
# One table per provenance class. Per-file exceptions: put a <file>.license next to the file
# (an adjacent .license file takes precedence over REUSE.toml - REUSE spec 3.3, "Order of precedence").
# Every file listed in ASSETS.md must resolve to exactly one SPDX expression here or in a .license file.
version = 1

# Class A: produced by a script in this repo. The script is GPL-3.0-only code; its output is dedicated to CC0 (proposal).
[[annotations]]
path = "generated/**"
SPDX-FileCopyrightText = "2026 <COPYRIGHT HOLDER> (generated by tools/assets/gen_placeholders.py)"
SPDX-License-Identifier = "CC0-1.0"

# Class C: AI-assisted / AI-generated. Same licence as class A, BUT each file needs a row in ASSETS.md with tool,
# model/version, date, prompt record and the human who selected/edited it (copyright-ownership uncertainty: see policy doc).
[[annotations]]
path = "ai-assisted/**"
SPDX-FileCopyrightText = "2026 <PERSON WHO DIRECTED THE GENERATION> (AI-assisted; see ASSETS.md)"
SPDX-License-Identifier = "CC0-1.0"

# Class B (member original) is NOT listed here on purpose: each file carries <file>.license with the author's own
# name and the licence the author granted in the signed statement (docs/compliance/author-authorization-statement.md).
# Class D (Flutter-drawn, i.e. Dart CustomPainter etc.) is source code, lives under app/lib, and is GPL-3.0-only.

# Directory note, not an asset. There are no placeholder asset files yet, and REUSE 3.3
# rejects a license text that no file references. This README is CC0-1.0 so
# LICENSES/CC0-1.0.txt stays in use until the first generated/ or ai-assisted/ file lands.
[[annotations]]
path = "README.md"
SPDX-FileCopyrightText = "2026 <COPYRIGHT HOLDER - see D-03 / authorisation statements>"
SPDX-License-Identifier = "CC0-1.0"
