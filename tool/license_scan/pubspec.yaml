name: license_scan
description: >-
  Offline license scan for the Lingowander workspace. Intentionally outside
  the pub workspace so the scanner's own dependencies are not product
  dependencies.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.14.0

dependencies:
  package_config: ">=2.2.0 <5.0.0"
  pana: ^0.22.21
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
